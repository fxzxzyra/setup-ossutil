name: Setup ossutil 2.x
description: Install and cache Alibaba Cloud ossutil 2.x
author: Fxzx Zyra
branding:
  icon: cloud
  color: orange
inputs:
  version:
    description: Exact ossutil 2.x version, or latest to query the newest stable 2.x release
    default: latest
  access-key-id:
    description: Alibaba Cloud AccessKey ID
  access-key-secret:
    description: Alibaba Cloud AccessKey secret
  region:
    description: OSS region, such as cn-shenzhen
  endpoint:
    description: Optional custom OSS endpoint
  bucket:
    description: Optional bucket name included as OSS_BUCKET in the env output
outputs:
  version:
    description: Installed ossutil version
  path:
    description: Directory containing the ossutil executable
  env:
    description: JSON object of supplied OSS authentication variables and bucket for step-level env injection
runs:
  using: node24
  main: dist/index.js
