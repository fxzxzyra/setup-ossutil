name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code and distribution checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - name: Verify committed distribution
        run: git diff --exit-code -- dist
      - run: npm test

  integration:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Set up ossutil
        id: ossutil
        uses: ./
        with:
          access-key-id: integration-test-id
          access-key-secret: integration-test-secret
          region: cn-shenzhen
          bucket: integration-test-bucket
          endpoint: https://oss-cn-shenzhen.aliyuncs.com
      - name: Verify step-scoped authentication output
        env: ${{ fromJSON(steps.ossutil.outputs.secrets) }}
        run: node -e "const assert = require('node:assert/strict'); for (const key of ['OSS_ACCESS_KEY_ID', 'OSS_ACCESS_KEY_SECRET', 'OSS_REGION', 'OSS_ENDPOINT', 'OSS_BUCKET']) assert.ok(process.env[key]);"
      - name: Verify authentication is absent from subsequent steps
        run: node -e "const assert = require('node:assert/strict'); for (const key of ['OSS_ACCESS_KEY_ID', 'OSS_ACCESS_KEY_SECRET', 'OSS_REGION', 'OSS_ENDPOINT', 'OSS_BUCKET', 'OSSUTIL_CONFIG_FILE']) assert.equal(process.env[key], undefined);"
      - name: Install without system archive tools and verify cache reuse
        run: npm run test:install
      - name: Verify installed version
        run: ossutil version
      - name: Test with installed ossutil
        env:
          OSSUTIL_EXECUTABLE: ${{ steps.ossutil.outputs.path }}/ossutil${{ runner.os == 'Windows' && '.exe' || '' }}
        run: npm test
